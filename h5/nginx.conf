server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Vue Router history 模式：深链回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 跨域模型：前端构建时注入 VITE_API_URL 指向 API 容器公网域名，
    # 浏览器直接打 <api域名>/api，nginx 不再反代（独立容器无 backend hostname）。
    # 若你在同一网络编排里且想让前端走相对 /api，可取消下方注释并把 backend
    # 换成同网络内 API 容器的实际主机名。
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    # }
    # location /uploads/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    # }
}
